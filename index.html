<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AquaSense AI</title>
  <meta name="description" content="AquaSense AI: monitoreo inteligente del pH del agua.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/views.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <script>
    try {
      var t = localStorage.getItem("aquasense.theme") || "DARK";
      var dark = t === "DARK" || (t === "AUTO" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) {}
  </script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript>AquaSense AI necesita JavaScript habilitado.</noscript>
</body>
</html>
